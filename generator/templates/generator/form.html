<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Road Athena - Ultimate PPT Builder</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #4f46e5;        /* Premium Indigo */
            --primary-hover: #4338ca;
            --bg-body: #f1f5f9;        /* Light Slate background */
            --bg-surface: #ffffff;
            --text-dark: #0f172a;      /* Slate 900 */
            --text-muted: #64748b;     /* Slate 500 */
            --border-light: #e2e8f0;
            --shadow-sm: 0 1px 2px 0 rgb(0 0 0 / 0.05);
            --shadow-md: 0 4px 6px -1px rgb(0 0 0 / 0.1), 0 2px 4px -2px rgb(0 0 0 / 0.1);
            --shadow-lg: 0 10px 15px -3px rgb(0 0 0 / 0.1), 0 4px 6px -4px rgb(0 0 0 / 0.1);
            --radius-md: 8px;
            --radius-lg: 16px;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', sans-serif; }
        
        body { background: var(--bg-body); color: var(--text-dark); height: 100vh; overflow: hidden; }

        /* Custom Mac-style Scrollbar */
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }

        .app-workspace { display: flex; height: 100vh; width: 100vw; }

        /* ================= COLUMN 1: GALLERY ================= */
        .template-gallery { width: 320px; background: var(--bg-surface); border-right: 1px solid var(--border-light); display: flex; flex-direction: column; flex-shrink: 0; z-index: 10; box-shadow: var(--shadow-sm); }
        
        .brand-header { padding: 25px 20px; background: linear-gradient(135deg, #1e293b, #0f172a); color: white; text-align: left; }
        .brand-header h1 { font-size: 20px; font-weight: 700; letter-spacing: -0.5px; display: flex; align-items: center; gap: 8px; }
        .brand-header h1::before { content: "⚡"; font-size: 22px; }
        .brand-header p { font-size: 12px; color: #94a3b8; margin-top: 6px; font-weight: 500; }
        
        .theme-picker-box { padding: 18px 20px; border-bottom: 1px solid var(--border-light); background: #f8fafc; }
        .theme-picker-box label { font-size: 10px; font-weight: 700; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.1em; }
        .theme-picker-flex { display: flex; align-items: center; gap: 12px; margin-top: 10px; }
        input[type="color"] { width: 36px; height: 36px; border: 2px solid #e2e8f0; border-radius: 50%; cursor: pointer; padding: 0; background: none; overflow: hidden; }
        input[type="color"]::-webkit-color-swatch-wrapper { padding: 0; }
        input[type="color"]::-webkit-color-swatch { border: none; border-radius: 50%; }
        
        .gallery-scroll { flex-grow: 1; overflow-y: auto; padding: 20px 15px; }
        .gallery-title { font-size: 10px; font-weight: 700; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.1em; margin-bottom: 15px; padding-left: 5px; }
        
        .gallery-item { width: 100%; padding: 14px 16px; background: transparent; border: 1px solid transparent; border-radius: var(--radius-md); text-align: left; font-size: 13px; font-weight: 600; color: #475569; cursor: pointer; margin-bottom: 6px; transition: all 0.2s ease; display: flex; align-items: center; }
        .gallery-item::before { content: ""; display: inline-block; width: 6px; height: 6px; border-radius: 50%; background: #cbd5e1; margin-right: 10px; transition: all 0.2s ease; }
        .gallery-item:hover { background: #f8fafc; color: var(--primary); border-color: var(--border-light); transform: translateX(4px); }
        .gallery-item:hover::before { background: var(--primary); transform: scale(1.5); }

        /* ================= COLUMN 2: WORKSPACE ================= */
        .workspace-center { flex-grow: 1; display: flex; flex-direction: column; background: var(--bg-body); overflow: hidden; position: relative; }
        
        .workspace-header { padding: 20px 40px; background: rgba(255, 255, 255, 0.9); backdrop-filter: blur(8px); border-bottom: 1px solid var(--border-light); z-index: 5; }
        .workspace-header h2 { font-size: 18px; color: var(--text-dark); font-weight: 700; display: flex; align-items: center; gap: 10px; }
        .workspace-header h2::before { content: ""; width: 12px; height: 12px; background: var(--primary); border-radius: 3px; display: inline-block; }
        
        .workspace-body { flex-grow: 1; padding: 40px 40px 100px; overflow-y: auto; scroll-behavior: smooth; }
        .form-content-wrapper { max-width: 900px; margin: 0 auto; width: 100%; }
        
        .slide-preview-box { background: var(--bg-surface); width: 100%; height: 320px; border-radius: var(--radius-lg); margin-bottom: 30px; display: flex; align-items: center; justify-content: center; overflow: hidden; border: 1px solid var(--border-light); position: relative; box-shadow: var(--shadow-sm); padding: 10px; }
        .slide-preview-box img { width: 100%; height: 100%; object-fit: contain; border-radius: 8px; }
        .preview-tag { position: absolute; top: 16px; left: 16px; background: rgba(15, 23, 42, 0.85); backdrop-filter: blur(4px); color: white; padding: 6px 12px; font-size: 11px; border-radius: 20px; font-weight: 600; letter-spacing: 0.5px; }

        .form-container { background: transparent; }
        
        /* Premium Form Fields */
        .form-group { margin-bottom: 24px; }
        label { display: block; font-size: 11px; font-weight: 700; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 8px; }
        
        input[type="text"], textarea { width: 100%; padding: 14px 16px; border: 1px solid var(--border-light); border-radius: var(--radius-md); font-size: 14px; color: var(--text-dark); background: var(--bg-surface); box-shadow: var(--shadow-sm); transition: all 0.2s ease; line-height: 1.5; }
        input[type="text"]:hover, textarea:hover { border-color: #cbd5e1; }
        input[type="text"]:focus, textarea:focus { border-color: var(--primary); background: var(--bg-surface); outline: none; box-shadow: 0 0 0 4px rgba(79, 70, 229, 0.15); }
        
        input[type="file"] { width: 100%; padding: 10px; border: 1px dashed #cbd5e1; border-radius: var(--radius-md); font-size: 13px; color: var(--text-muted); background: #f8fafc; cursor: pointer; transition: all 0.2s ease; }
        input[type="file"]:hover { border-color: var(--primary); background: #e0e7ff; color: var(--primary); }

        .two-column { display: grid; grid-template-columns: 1fr 1fr; gap: 24px; }
        .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 24px; }
        
        .inner-box { background: var(--bg-surface); border: 1px solid var(--border-light); padding: 24px; border-radius: var(--radius-lg); box-shadow: var(--shadow-sm); transition: all 0.2s ease; }
        .inner-box:hover { box-shadow: var(--shadow-md); border-color: #cbd5e1; }
        
        .add-to-deck-btn { width: 100%; padding: 16px; background: var(--primary); color: white; border: none; border-radius: var(--radius-md); font-size: 15px; font-weight: 600; cursor: pointer; transition: all 0.2s ease; margin-top: 20px; display: flex; align-items: center; justify-content: center; gap: 10px; box-shadow: 0 4px 6px rgba(79, 70, 229, 0.25); }
        .add-to-deck-btn:hover { background: var(--primary-hover); transform: translateY(-2px); box-shadow: 0 6px 12px rgba(79, 70, 229, 0.3); }
        .add-to-deck-btn:active { transform: translateY(0); }

        /* ================= COLUMN 3: LIVE DECK ================= */
        .deck-sidebar { width: 360px; background: var(--bg-surface); display: flex; flex-direction: column; flex-shrink: 0; border-left: 1px solid var(--border-light); box-shadow: -4px 0 15px rgba(0,0,0,0.02); z-index: 10; }
        
        .deck-header { padding: 25px 20px; border-bottom: 1px solid var(--border-light); background: #f8fafc; }
        .deck-header h3 { font-size: 15px; font-weight: 700; color: var(--text-dark); text-transform: uppercase; letter-spacing: 0.5px; display: flex; align-items: center; gap: 8px; }
        .deck-header h3::before { content: "📋"; font-size: 18px; }
        
        .deck-list { flex-grow: 1; overflow-y: auto; padding: 20px; background: var(--bg-surface); }
        
        .deck-item { background: var(--bg-surface); border: 1px solid var(--border-light); border-radius: var(--radius-md); padding: 14px 16px; margin-bottom: 12px; display: flex; align-items: center; justify-content: space-between; box-shadow: var(--shadow-sm); animation: slideIn 0.3s cubic-bezier(0.16, 1, 0.3, 1); cursor: grab; transition: all 0.2s ease; }
        .deck-item:hover { border-color: #cbd5e1; box-shadow: var(--shadow-md); transform: translateY(-2px); }
        .deck-item:active { cursor: grabbing; transform: scale(0.98); }
        
        .deck-item.dragging { opacity: 0.5; background: #f8fafc; border-style: dashed; }
        .deck-item.over { border: 2px dashed var(--primary); background: #e0e7ff; transform: scale(1.02); }

        @keyframes slideIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        
        .deck-item-info { font-size: 14px; font-weight: 600; color: var(--text-dark); display: flex; align-items: center; gap: 12px; }
        .drag-handle { color: #cbd5e1; font-size: 16px; cursor: grab; display: flex; flex-direction: column; gap: 2px; }
        .drag-handle::before, .drag-handle::after { content: ""; display: block; width: 12px; height: 2px; background: #94a3b8; border-radius: 2px; }
        .deck-item:hover .drag-handle::before, .deck-item:hover .drag-handle::after { background: var(--text-muted); }
        .deck-item:active .drag-handle { cursor: grabbing; }

        .control-btn.delete { background: #fef2f2; border: 1px solid #fee2e2; width: 28px; height: 28px; display: flex; align-items: center; justify-content: center; border-radius: 6px; font-size: 14px; font-weight: bold; cursor: pointer; color: #ef4444; transition: all 0.2s ease; }
        .control-btn.delete:hover { background: #ef4444; color: white; border-color: #ef4444; }

        .deck-footer { padding: 24px; border-top: 1px solid var(--border-light); background: #f8fafc; }
        .generate-btn { width: 100%; padding: 18px; background: #10b981; color: white; border: none; border-radius: var(--radius-md); font-size: 16px; font-weight: 700; cursor: pointer; box-shadow: 0 4px 12px rgba(16, 185, 129, 0.3); transition: all 0.2s ease; text-transform: uppercase; letter-spacing: 0.5px; }
        .generate-btn:hover { background: #059669; transform: translateY(-2px); box-shadow: 0 6px 16px rgba(16, 185, 129, 0.4); }
        .generate-btn:active { transform: translateY(0); }
        
        .slide-form-block { display: none; animation: fadeIn 0.4s ease; }
        .slide-form-block.active { display: block; }

        @keyframes fadeIn { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body>

    <div class="app-workspace">
        <form id="master-ppt-form" method="POST" enctype="multipart/form-data" style="display: contents;">
            {% csrf_token %}
            <input type="hidden" name="slide_order_json" id="slide_order_json" value="[]">

            <div class="template-gallery">
                <div class="brand-header">
                    <h1>Road Athena</h1>
                    <p>Dynamic Core Deck Customizer</p>
                </div>
                
                <div class="theme-picker-box">
                    <label>Master Brand Theme</label>
                    <div class="theme-picker-flex">
                        <input type="color" name="theme_color" value="#0056b3">
                        <span style="font-size: 13px; color: var(--text-dark); font-weight: 600;">Accent Color</span>
                    </div>
                </div>

                <div class="gallery-scroll">
                    <div class="gallery-title">Select Template Module</div>
                    <button type="button" class="gallery-item" onclick="loadWorkspace(1)">Slide 1: Cover Intro</button>
                    <button type="button" class="gallery-item" onclick="loadWorkspace(2)">Slide 2: About Us</button>
                    <button type="button" class="gallery-item" onclick="loadWorkspace(3)">Slide 3: Problem Statement</button>
                    <button type="button" class="gallery-item" onclick="loadWorkspace(4)">Slide 4: ERP Blueprint</button>
                    <button type="button" class="gallery-item" onclick="loadWorkspace(5)">Slide 5: Our Solution</button>
                    <button type="button" class="gallery-item" onclick="loadWorkspace(6)">Slide 6: Solutions Used</button>
                    <button type="button" class="gallery-item" onclick="loadWorkspace(7)">Slide 7: Pre & Post Analysis</button>
                    <button type="button" class="gallery-item" onclick="loadWorkspace(8)">Slide 8: AI Capabilities</button>
                    <button type="button" class="gallery-item" onclick="loadWorkspace(9)">Slide 9: Demo Video</button>
                    <button type="button" class="gallery-item" onclick="loadWorkspace(10)">Slide 10: Heat maps & Stats</button>
                    <button type="button" class="gallery-item" onclick="loadWorkspace(11)">Slide 11: Cloud Dashboard</button>
                    <button type="button" class="gallery-item" onclick="loadWorkspace(12)">Slide 12: Action Stats</button>
                    <button type="button" class="gallery-item" onclick="loadWorkspace(13)">Slide 13: Workflow Journey</button>
                    <button type="button" class="gallery-item" onclick="loadWorkspace(14)">Slide 14: Global Partnerships</button>
                    <button type="button" class="gallery-item" onclick="loadWorkspace(15)">Slide 15: Projects Delivered</button>
                    <button type="button" class="gallery-item" onclick="loadWorkspace(16)">Slide 16: U.S Market Strategy</button>
                    <button type="button" class="gallery-item" onclick="loadWorkspace(17)">Slide 17: Awards & Recog</button>
                    <button type="button" class="gallery-item" onclick="loadWorkspace(18)">Slide 18: Core Leadership</button>
                    <button type="button" class="gallery-item" onclick="loadWorkspace(19)">Slide 19: Thank You & Contact</button>
                    <button type="button" class="gallery-item" onclick="loadWorkspace(20)">Slide 20: 2nd Intro Slide</button>
                </div>
            </div>

            <div class="workspace-center">
                <div class="workspace-header">
                    <h2 id="current-slide-title">Slide 1: Cover Intro</h2>
                </div>
                <div class="workspace-body">
                    <div class="form-content-wrapper">
                        
                        <div class="slide-preview-box">
                            <span class="preview-tag">Master Layout Reference</span>
                            <img id="layout-preview-img" src="/static/preview/slide1.png" alt="Reference Blueprint Snapshot">
                        </div>

                        <div class="form-container">
                            
                            <div id="form-block-1" class="slide-form-block active">
                                <div class="inner-box">
                                    <div class="form-group" style="margin-bottom:0;">
                                        <label>Upload Cover Background Image</label>
                                        <input type="file" name="intro_img" accept="image/*">
                                    </div>
                                </div>
                                <button type="button" class="add-to-deck-btn" onclick="addSlideToDeck(1, 'Cover Intro')">➕ Add Slide to My Deck</button>
                            </div>

                            <div id="form-block-2" class="slide-form-block">
                                <div class="inner-box" style="margin-bottom: 24px;">
                                    <div class="two-column">
                                        <div class="form-group" style="margin-bottom:0;">
                                            <label>WHO WE ARE (Bullets)</label>
                                            <textarea name="who_we_are" rows="3">AI-driven company transforming infrastructure using AI, GIS, and analytics.&#10;Focused on building smarter, more sustainable and efficient systems.</textarea>
                                        </div>
                                        <div class="form-group" style="margin-bottom:0;">
                                            <label>OUR GOAL (Bullets)</label>
                                            <textarea name="our_goals" rows="3">Develop AI-powered integrated infrastructure solutions for future smart cities.&#10;Deliver advanced AI-driven solutions for road safety, monitoring & maintenance globally.</textarea>
                                        </div>
                                    </div>
                                </div>
                                <div class="inner-box">
                                    <label style="margin-bottom: 16px;">Key Statistics Highlights</label>
                                    <div class="grid-2">
                                        <div class="form-group" style="margin-bottom:0;"><input type="text" name="about_stat1" value="1,85,000+ Lane KMs Processed" placeholder="Stat 1"></div>
                                        <div class="form-group" style="margin-bottom:0;"><input type="text" name="about_stat2" value="80,000+ Unique Roads Surveyed" placeholder="Stat 2"></div>
                                        <div class="form-group" style="margin-bottom:0;"><input type="text" name="about_stat3" value="250+ AI Detection Classes" placeholder="Stat 3"></div>
                                        <div class="form-group" style="margin-bottom:0;"><input type="text" name="about_stat4" value="20+ States Coverage" placeholder="Stat 4"></div>
                                    </div>
                                </div>
                                <button type="button" class="add-to-deck-btn" onclick="addSlideToDeck(2, 'About Us')">➕ Add Slide to My Deck</button>
                            </div>

                            <div id="form-block-3" class="slide-form-block">
                                <div class="grid-2">
                                    <div class="inner-box">
                                        <label>Problem Area 1</label>
                                        <input type="text" name="psh_1" value="Expensive, Time-Consuming & Manual Surveys" style="margin-bottom:12px; font-weight: 600;">
                                        <textarea name="ds_1" rows="2">Manual road surveys are costly, slow, and manpower-intensive.</textarea>
                                    </div>
                                    <div class="inner-box">
                                        <label>Problem Area 2</label>
                                        <input type="text" name="psh_2" value="Poor Infrastructure & Accidents" style="margin-bottom:12px; font-weight: 600;">
                                        <textarea name="ds_2" rows="2">Undetected road defects lead to accidents and economic losses.</textarea>
                                    </div>
                                    <div class="inner-box">
                                        <label>Problem Area 3</label>
                                        <input type="text" name="psh_3" value="Lack of Digitization" style="margin-bottom:12px; font-weight: 600;">
                                        <textarea name="ds_3" rows="2">Road data remains siloed, limiting maintenance planning.</textarea>
                                    </div>
                                    <div class="inner-box">
                                        <label>Problem Area 4</label>
                                        <input type="text" name="psh_4" value="Rapid Environmental Changes" style="margin-bottom:12px; font-weight: 600;">
                                        <textarea name="ds_4" rows="2">Climate change, traffic, and construction accelerate road damage.</textarea>
                                    </div>
                                </div>
                                <button type="button" class="add-to-deck-btn" onclick="addSlideToDeck(3, 'Problem Statement')">➕ Add Slide to My Deck</button>
                            </div>

                            <div id="form-block-4" class="slide-form-block">
                                <div class="inner-box" style="margin-bottom: 24px;">
                                    <div class="form-group" style="margin-bottom:0;">
                                        <label>Main Slide Text Summary</label>
                                        <textarea name="erp_main" rows="2">Complete Digital ERP Solution for Road Infrastructure with real-time monitoring and asset management.</textarea>
                                    </div>
                                </div>
                                <div class="grid-2">
                                    <div class="inner-box"><label>Upload Left Image</label><input type="file" name="erp_img_1" accept="image/*"></div>
                                    <div class="inner-box"><label>Upload Right Image</label><input type="file" name="erp_img_2" accept="image/*"></div>
                                </div>
                                <button type="button" class="add-to-deck-btn" onclick="addSlideToDeck(4, 'ERP Blueprint')">➕ Add Slide to My Deck</button>
                            </div>

                            <div id="form-block-5" class="slide-form-block">
                                <div class="inner-box" style="margin-bottom: 24px;">
                                    <div class="form-group" style="margin-bottom:0;">
                                        <label>Main Context Layout Title</label>
                                        <input type="text" name="sol_main" value="Our devices can be mounted on any vehicle- 2-wheelers, 4-wheelers & more" style="font-weight: 600;">
                                    </div>
                                </div>
                                <div class="grid-2">
                                    <div class="inner-box"><input type="text" name="solh_1" value="Fast & Reliable" style="margin-bottom:10px; font-weight:700;"><textarea name="sold_1" rows="2">AI-powered data capture at survey speed with 99%+ uptime reliability</textarea></div>
                                    <div class="inner-box"><input type="text" name="solh_2" value="Cloud-Powered" style="margin-bottom:10px; font-weight:700;"><textarea name="sold_2" rows="2">All data stored securely on cloud — clients access anytime, anywhere</textarea></div>
                                    <div class="inner-box"><input type="text" name="solh_3" value="Scalable" style="margin-bottom:10px; font-weight:700;"><textarea name="sold_3" rows="2">From city roads to national highways — scales to any network size</textarea></div>
                                    <div class="inner-box"><input type="text" name="solh_4" value="Efficient" style="margin-bottom:10px; font-weight:700;"><textarea name="sold_4" rows="2">End-to-end automated AI models reduce manual effort by 80%+</textarea></div>
                                </div>
                                <button type="button" class="add-to-deck-btn" onclick="addSlideToDeck(5, 'Our Solution')">➕ Add Slide to My Deck</button>
                            </div>

                            <div id="form-block-6" class="slide-form-block">
                                <div class="inner-box" style="margin-bottom: 24px;">
                                    <div class="form-group" style="margin-bottom:0;">
                                        <label>Main Module Title</label>
                                        <input type="text" name="sol_used_main" value="Solution Used by Clients" style="font-weight: 600;">
                                    </div>
                                </div>
                                <div class="grid-2">
                                    <div class="inner-box"><input type="text" name="suh_1" value="Road Asset & Defect Detection" style="font-weight:600;"><textarea name="sud_1" rows="2" style="margin-top:8px;">AI detects 250+ classes of road defects and furniture</textarea></div>
                                    <div class="inner-box"><input type="text" name="suh_2" value="Stats & Dashboard" style="font-weight:600;"><textarea name="sud_2" rows="2" style="margin-top:8px;">Real-time statistics and GIS-mapped road analytics</textarea></div>
                                    <div class="inner-box"><input type="text" name="suh_3" value="Pre & Post Analysis" style="font-weight:600;"><textarea name="sud_3" rows="2" style="margin-top:8px;">Before/after comparisons for maintenance validation</textarea></div>
                                    <div class="inner-box"><input type="text" name="suh_4" value="Maintenance History" style="font-weight:600;"><textarea name="sud_4" rows="2" style="margin-top:8px;">Complete maintenance audit trail and scheduling</textarea></div>
                                    <div class="inner-box"><input type="text" name="suh_5" value="Overlap Detection" style="font-weight:600;"><textarea name="sud_5" rows="2" style="margin-top:8px;">Smart road segmentation and asset registration</textarea></div>
                                    <div class="inner-box"><input type="text" name="suh_6" value="Road Safety Analysis" style="font-weight:600;"><textarea name="sud_6" rows="2" style="margin-top:8px;">Safety audits for highways, rural and urban roads</textarea></div>
                                    <div class="inner-box"><input type="text" name="suh_7" value="DLP Audits & Objective Rating" style="font-weight:600;"><textarea name="sud_7" rows="2" style="margin-top:8px;">Objective road condition rating and defect liability audits</textarea></div>
                                    <div class="inner-box"><input type="text" name="suh_8" value="DPR Preparation" style="font-weight:600;"><textarea name="sud_8" rows="2" style="margin-top:8px;">Automated Detailed Project Report generation</textarea></div>
                                </div>
                                <button type="button" class="add-to-deck-btn" onclick="addSlideToDeck(6, 'Solutions Used')">➕ Add Slide to My Deck</button>
                            </div>

                            <div id="form-block-7" class="slide-form-block">
                                <div class="inner-box" style="margin-bottom: 24px;">
                                    <div class="form-group" style="margin-bottom:0;">
                                        <label>Header Title</label>
                                        <input type="text" name="pre_post_main" value="Pre and Post Analysis" style="font-weight: 600;">
                                    </div>
                                </div>
                                <div class="grid-2">
                                    <div class="inner-box"><label>Image 1 (Pre)</label><input type="file" name="pre_post_img_1" accept="image/*"></div>
                                    <div class="inner-box"><label>Image 2 (Post)</label><input type="file" name="pre_post_img_2" accept="image/*"></div>
                                    <div class="inner-box"><label>Image 3 (Pre)</label><input type="file" name="pre_post_img_3" accept="image/*"></div>

    <script>
        let currentDeck = [];
        let dragStartIndex = -1;

        function loadWorkspace(slideId) {
            document.querySelectorAll('.slide-form-block').forEach(b => b.classList.remove('active'));
            const selectedBlock = document.getElementById(`form-block-${slideId}`);
            if (selectedBlock) selectedBlock.classList.add('active');
            
            document.getElementById('current-slide-title').innerText = `Editing Slide ${slideId} Configuration`;
            
            // Note: If you don't have an image for slide 20 yet, this might show a broken image icon. 
            // That's normal until you add a preview image for slide 20 in your static folder.
            document.getElementById('layout-preview-img').src = `/static/preview/slide${slideId}.png`;
        }

        function addSlideToDeck(slideId, title) {
            let cleanTitle = title.replace(/Slide \d+:\s*/g, '');
            const uniqueId = 'slide_' + Date.now() + '_' + Math.random().toString(36).substr(2, 4);
            currentDeck.push({ uniqueId: uniqueId, slideId: slideId, title: cleanTitle });
            renderDeck();
        }

        function deleteFromDeck(uniqueId) {
            currentDeck = currentDeck.filter(item => item.uniqueId !== uniqueId);
            renderDeck();
        }

        function handleDragStart(e) {
            dragStartIndex = +this.dataset.index;
            e.dataTransfer.effectAllowed = 'move';
            this.classList.add('dragging');
        }

        function handleDragOver(e) {
            e.preventDefault();
            e.dataTransfer.dropEffect = 'move';
            return false;
        }

        function handleDragEnter(e) { this.classList.add('over'); }
        function handleDragLeave(e) { this.classList.remove('over'); }

        function handleDrop(e) {
            e.stopPropagation();
            const dragEndIndex = +this.dataset.index;
            if (dragStartIndex !== dragEndIndex) {
                const itemToMove = currentDeck.splice(dragStartIndex, 1)[0];
                currentDeck.splice(dragEndIndex, 0, itemToMove);
                renderDeck();
            }
            return false;
        }

        function handleDragEnd(e) {
            this.classList.remove('dragging');
            document.querySelectorAll('.deck-item').forEach(item => item.classList.remove('over'));
        }

        function renderDeck() {
            const container = document.getElementById('active-deck-container');
            container.innerHTML = '';
            
            currentDeck.forEach((item, index) => {
                const div = document.createElement('div');
                div.className = 'deck-item';
                div.draggable = true;
                div.dataset.index = index;
                
                div.innerHTML = `
                    <div class="deck-item-info">
                        <span class="drag-handle" title="Drag to reorder"></span>
                        ${index + 1}. ${item.title}
                    </div>
                    <button type="button" class="control-btn delete" onclick="deleteFromDeck('${item.uniqueId}')">✕</button>
                `;

                div.addEventListener('dragstart', handleDragStart);
                div.addEventListener('dragover', handleDragOver);
                div.addEventListener('dragenter', handleDragEnter);
                div.addEventListener('dragleave', handleDragLeave);
                div.addEventListener('drop', handleDrop);
                div.addEventListener('dragend', handleDragEnd);

                container.appendChild(div);
            });

            document.getElementById('slide_order_json').value = JSON.stringify(currentDeck);
        }
    </script>
